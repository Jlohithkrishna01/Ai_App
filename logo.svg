<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="lumiq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Tile -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#lumiq-grad)" />
  <rect x="9.5" y="9.5" width="81" height="81" rx="22.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Stylized Modern 'L' AI Path -->
  <path d="M34 26 V64 C34 69.52 38.48 74 44 74 H68 C70.21 74 72 72.21 72 70 C72 67.79 70.21 66 68 66 H46 C44.9 66 44 65.1 44 64 V26 C44 23.79 42.21 22 40 22 C37.79 22 36 23.79 34 26 Z" fill="#FFFFFF" />

  <!-- Luminous Quantum Energy Pulse Dot -->
  <circle cx="68" cy="34" r="6" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="68" cy="34" r="3.5" fill="#FFFFFF" />
  
  <!-- Subtle Neural Connection Line -->
  <line x1="44" y1="34" x2="62" y2="34" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="3 3" />
</svg>
